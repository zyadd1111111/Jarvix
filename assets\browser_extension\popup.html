<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Jarvix Browser Bridge</title>
<style>body{font:13px system-ui;background:#13141c;color:#e4e5f4;width:290px;padding:14px}h1{font-size:18px}button{padding:8px 12px;margin:4px 3px 4px 0;background:#39305f;color:white;border:1px solid #665591;border-radius:5px}p{line-height:1.5}code{font-size:11px;user-select:all;word-break:break-all}#status{color:#b5c9ed}</style></head>
<body><h1>Jarvix · Browser</h1><p>Register this extension ID in Jarvix and enable Browser control. Start the connection there, then connect here.</p>
<code id="identifier"></code><p id="status">Disconnected</p>
<button id="connect">Connect</button><button id="disconnect">Disconnect</button>
<button id="downloads">Allow download inspection</button><button id="remove-downloads">Remove download access</button>
<p>Page access is requested once. Jarvix reads pages only on request. Passwords and security controls cannot be automated.</p>
<script src="popup.js"></script></body></html>
