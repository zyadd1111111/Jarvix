name: Package Jarvix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Test and build the Windows package
        shell: pwsh
        run: ./scripts/build.ps1 -PythonPath (Get-Command python).Source
      - name: Upload Jarvix package
        uses: actions/upload-artifact@v4
        with:
          name: Jarvix-${{ github.sha }}-windows-x64
          path: |
            dist/Jarvix-*-windows-x64.zip
            dist/*.whl
          if-no-files-found: error
      - name: Publish verified Windows release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $archive = "dist/Jarvix-$version-windows-x64.zip"
          $checksum = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256" -Encoding ascii
          $changes = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Select-Object -Index 1
          $notes = "## What's new and revamped`n`n$changes`n## Install`n`nDownload and extract the Windows x64 ZIP, then run Jarvix\Jarvix.exe. Keep the _internal folder beside it. Source installation instructions remain in README.md.`n`nSHA-256: $checksum"
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Jarvix $version" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
