[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "jarvix"
version = "0.2.0"
description = "A local-first desktop AI command center"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jarvix contributors"}]
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "psutil>=6.1,<8",
  "keyring>=25.6,<26",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "pypdf>=5,<7",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "build>=1.2,<2", "pyinstaller>=6.12,<7"]

[project.gui-scripts]
jarvix = "jarvix.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
